[project]
name = "cairn-schemas"
version = "0.1.0"
description = "Data contracts for Cairn: Pydantic models that generate Avro, Iceberg DDL and JSON Schema."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "fastavro>=1.9",
  "jsonschema>=4.21",
  "sqlglot>=25",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_schemas"]
