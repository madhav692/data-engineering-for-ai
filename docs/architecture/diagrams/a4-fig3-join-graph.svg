<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" role="img" aria-labelledby="title">
  <title id="title">What joins to the request log: every edge is one of the article's queries</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">What joins to the request log: every edge is one of the five queries</text>

  <!-- edges, drawn first so the label boxes sit on top -->
  <g fill="none" stroke="#9a9a9a" stroke-width="1.25">
    <path d="M590 150L792 73" marker-end="url(#arrow)"/>
    <path d="M590 177H792" marker-end="url(#arrow)"/>
    <path d="M864 194V264" marker-end="url(#arrow)"/>
    <path d="M168 113L370 150" marker-end="url(#arrow)"/>
    <path d="M168 247L370 210" marker-end="url(#arrow)"/>
  </g>

  <!-- requests, the accent -->
  <g>
    <rect x="370" y="134" width="220" height="92" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <text x="382" y="156" font-size="13" font-weight="600" fill="#1f1f1f">requests</text>
    <text x="382" y="174" font-size="10.5" fill="#1f1f1f">request_id · six lineage columns</text>
    <text x="382" y="190" font-size="10.5" fill="#1f1f1f">retrieved_chunks[] · hashes</text>
    <text x="382" y="206" font-size="10.5" fill="#1f1f1f">latency · tokens · cost · status</text>
  </g>

  <!-- the others -->
  <g fill="#1f1f1f" font-size="12.5" font-weight="600">
    <rect x="24" y="96" width="144" height="34" rx="8" fill="#ffffff" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="96" y="118" text-anchor="middle">feedback</text>
    <rect x="24" y="230" width="144" height="34" rx="8" fill="#ffffff" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="96" y="252" text-anchor="middle">eval_runs</text>
    <rect x="792" y="56" width="144" height="34" rx="8" fill="#ffffff" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="864" y="78" text-anchor="middle">index_snapshots</text>
    <rect x="792" y="160" width="144" height="34" rx="8" fill="#ffffff" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="864" y="182" text-anchor="middle">chunks</text>
    <rect x="792" y="264" width="144" height="34" rx="8" fill="#ffffff" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="864" y="286" text-anchor="middle">latest_documents</text>
  </g>

  <!-- edge labels, beside the lines -->
  <g font-size="10">
    <text x="710" y="152" text-anchor="middle" fill="#6b6b6b">index_snapshot_id</text>
    <text x="710" y="166" text-anchor="middle" fill="#2563eb">Q2  which versions served</text>

    <text x="691" y="193" text-anchor="middle" fill="#6b6b6b">retrieved_chunks[].chunk_id</text>
    <text x="691" y="207" text-anchor="middle" fill="#2563eb">Q1  reproduce  ·  Q5  blast radius</text>

    <text x="872" y="233" fill="#6b6b6b">doc_id</text>

    <text x="180" y="158" fill="#6b6b6b">request_id</text>
    <text x="180" y="172" fill="#2563eb">Q4  thumbs down per version</text>

    <text x="180" y="194" fill="#6b6b6b">config = the six lineage columns</text>
    <text x="180" y="208" fill="#2563eb">Q4b  offline is the same table</text>
  </g>

  <text x="24" y="326" fill="#6b6b6b">Q3, cost and latency by generator, needs no join: it is a GROUP BY over the row itself.</text>
</svg>
