<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" role="img" aria-labelledby="title">
  <title id="title">The lineage spine: six entities, and the version each carries</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">The lineage spine: six entities, and the version each carries</text>

  <!-- connectors -->
  <g fill="none" stroke="#9a9a9a" stroke-width="1.25">
    <path d="M184 108H208" marker-end="url(#arrow)"/>
    <path d="M368 108H392" marker-end="url(#arrow)"/>
    <path d="M552 108H576" marker-end="url(#arrow)"/>
    <path d="M656 152V212" marker-end="url(#arrow)"/>
    <path d="M576 256H552" marker-end="url(#arrow)"/>
    <path d="M392 256H368" marker-end="url(#arrow)"/>
  </g>

  <!-- row 1 -->
  <g>
    <rect x="24" y="64" width="160" height="88" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="104" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Document</text>
    <text x="104" y="108" text-anchor="middle" fill="#6b6b6b">doc_id (identity)</text>
    <text x="104" y="124" text-anchor="middle" fill="#6b6b6b">content_sha256</text>
    <text x="104" y="140" text-anchor="middle" fill="#6b6b6b">source_id, uri, acl</text>
  </g>
  <g>
    <rect x="208" y="64" width="160" height="88" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="288" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Chunk</text>
    <text x="288" y="108" text-anchor="middle" fill="#6b6b6b">chunk_id (derived)</text>
    <text x="288" y="124" text-anchor="middle" fill="#6b6b6b">parser_version</text>
    <text x="288" y="140" text-anchor="middle" fill="#6b6b6b">chunker_version</text>
  </g>
  <g>
    <rect x="392" y="64" width="160" height="88" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="472" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Embedding</text>
    <text x="472" y="108" text-anchor="middle" fill="#6b6b6b">chunk_id</text>
    <text x="472" y="124" text-anchor="middle" fill="#6b6b6b">embedding_model_id</text>
    <text x="472" y="140" text-anchor="middle" fill="#6b6b6b">vector[dims], job_id</text>
  </g>
  <g>
    <rect x="576" y="64" width="160" height="88" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="656" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">IndexSnapshot</text>
    <text x="656" y="108" text-anchor="middle" fill="#6b6b6b">index_snapshot_id</text>
    <text x="656" y="124" text-anchor="middle" fill="#6b6b6b">embedding_model_id</text>
    <text x="656" y="140" text-anchor="middle" fill="#6b6b6b">lakehouse_snapshot_id</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="576" y="212" width="160" height="88" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <text x="656" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Request</text>
    <text x="656" y="256" text-anchor="middle" fill="#1f1f1f">request_id, tenant_id</text>
    <text x="656" y="272" text-anchor="middle" fill="#1f1f1f">index_snapshot_id</text>
    <text x="656" y="288" text-anchor="middle" fill="#1f1f1f">chunk_ids, llm_id</text>
  </g>
  <g>
    <rect x="392" y="212" width="160" height="88" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="472" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Feedback</text>
    <text x="472" y="256" text-anchor="middle" fill="#6b6b6b">feedback_id</text>
    <text x="472" y="272" text-anchor="middle" fill="#6b6b6b">request_id</text>
    <text x="472" y="288" text-anchor="middle" fill="#6b6b6b">kind, value, actor</text>
  </g>
  <g>
    <rect x="208" y="212" width="160" height="88" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="288" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">EvalRun</text>
    <text x="288" y="256" text-anchor="middle" fill="#6b6b6b">run_id</text>
    <text x="288" y="272" text-anchor="middle" fill="#6b6b6b">eval_set_id, version</text>
    <text x="288" y="288" text-anchor="middle" fill="#6b6b6b">same keys as Request</text>
  </g>

  <text x="646" y="186" text-anchor="end" fill="#6b6b6b">serving pins the snapshot it read</text>
  <text x="24" y="336" fill="#6b6b6b">Every row carries tenant_id, created_at and the version that made it; rows that touched a model carry tokens and cost.</text>
</svg>
