<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" width="920" height="372" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" role="img" aria-labelledby="title">
  <title id="title">One request, one row: the six column groups of the request log</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="920" height="372" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">One request, one row: six groups of columns</text>
  <text x="24" y="46" fill="#6b6b6b">The outlined group is the lineage a row will not construct without. Hashes are always kept; the two texts by tenant policy.</text>

  <!-- the row: six group boxes -->
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#1f1f1f">
    <!-- identity -->
    <rect x="24" y="66" width="142" height="160" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="36" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Identity</text>
    <text x="36" y="106">request_id</text>
    <text x="36" y="122">tenant_id</text>
    <text x="36" y="138">user_id_hash</text>
    <text x="36" y="154">received_at</text>
    <text x="36" y="170">created_at</text>
    <text x="36" y="186">schema_version</text>
    <text x="36" y="202">trace_id</text>

    <!-- the question -->
    <rect x="174" y="66" width="112" height="160" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="186" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">The question</text>
    <text x="186" y="106" fill="#6b6b6b">query_text</text>
    <text x="186" y="122">query_sha256</text>

    <!-- lineage: the accent -->
    <rect x="294" y="66" width="190" height="160" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
    <text x="306" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Lineage · required</text>
    <text x="306" y="106">prompt_template_version</text>
    <text x="306" y="122">retrieval_config_version</text>
    <text x="306" y="138">index_snapshot_id</text>
    <text x="306" y="154">embedding_model_id</text>
    <text x="306" y="170">reranker_id</text>
    <text x="306" y="186">llm_id</text>
    <text x="306" y="202">llm_params</text>

    <!-- what the model saw -->
    <rect x="492" y="66" width="150" height="160" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="504" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">What the model saw</text>
    <text x="504" y="106">filters</text>
    <text x="504" y="122" font-weight="600">retrieved_chunks</text>
    <text x="504" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#6b6b6b">ids and text hashes,</text>
    <text x="504" y="156" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#6b6b6b">never the text itself</text>

    <!-- the answer -->
    <rect x="650" y="66" width="120" height="160" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="662" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">The answer</text>
    <text x="662" y="106" fill="#6b6b6b">response_text</text>
    <text x="662" y="122">response_sha256</text>

    <!-- economics and outcome -->
    <rect x="778" y="66" width="118" height="160" rx="8" fill="none" stroke="#c7c7c7" stroke-width="1.25"/>
    <text x="790" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Cost, outcome</text>
    <text x="790" y="106">latency</text>
    <text x="790" y="122">tokens_in</text>
    <text x="790" y="138">tokens_out</text>
    <text x="790" y="154">cost_usd</text>
    <text x="790" y="170" font-weight="600">status</text>
    <text x="790" y="188" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#6b6b6b">ok · error · timeout</text>
  </g>

  <!-- the nested strip: retrieved_chunks, in context order -->
  <path d="M567 226V248" fill="none" stroke="#9a9a9a" stroke-width="1.25" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="24" y="250" fill="#6b6b6b">retrieved_chunks, in context order: five cells of 150 bytes, each pinning one chunk's exact text</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#1f1f1f">
    <rect x="24" y="262" width="160" height="60" rx="6" fill="#f4f4f4" stroke="#c7c7c7" stroke-width="1"/>
    <text x="34" y="280">rank 1   score 0.8427</text>
    <text x="34" y="296">chk_045383c16561ac59…</text>
    <text x="34" y="312" fill="#6b6b6b">sha ea90c55b947fe1ac…</text>

    <rect x="202" y="262" width="160" height="60" rx="6" fill="#f4f4f4" stroke="#c7c7c7" stroke-width="1"/>
    <text x="212" y="280">rank 2   score 0.8368</text>
    <text x="212" y="296">chk_66dfb8daa07f5c1f…</text>
    <text x="212" y="312" fill="#6b6b6b">sha 07e2ba9ce6db2116…</text>

    <rect x="380" y="262" width="160" height="60" rx="6" fill="#f4f4f4" stroke="#c7c7c7" stroke-width="1"/>
    <text x="390" y="280">rank 3   score 0.8326</text>
    <text x="390" y="296">chk_4ce9e47dba651cb1…</text>
    <text x="390" y="312" fill="#6b6b6b">sha fea79b5cfc43ed3d…</text>

    <rect x="558" y="262" width="160" height="60" rx="6" fill="#f4f4f4" stroke="#c7c7c7" stroke-width="1"/>
    <text x="568" y="280">rank 4   score 0.7875</text>
    <text x="568" y="296">chk_e786deda78a27780…</text>
    <text x="568" y="312" fill="#6b6b6b">sha 2222bf31735d986b…</text>

    <rect x="736" y="262" width="160" height="60" rx="6" fill="#f4f4f4" stroke="#c7c7c7" stroke-width="1"/>
    <text x="746" y="280">rank 5   score 0.7737</text>
    <text x="746" y="296">chk_db3d7f124aecff06…</text>
    <text x="746" y="312" fill="#6b6b6b">sha d129c86996a08bd1…</text>
  </g>

  <text x="24" y="352" fill="#6b6b6b">2.2 KB per row with five chunks and an 850-character answer · one row per request, written before the client sees the answer</text>
</svg>
