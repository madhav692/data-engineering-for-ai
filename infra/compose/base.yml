# Cairn Stage 0: three containers (postgres, seaweedfs, api), one bind mount, make on the host.
#
#   docker compose --project-directory . -f infra/compose/base.yml --profile core up -d --wait
#
# Run from the repository root: paths below are relative to it (--project-directory), and the
# optional .env at the root is read. Ports bind to 127.0.0.1; CAIRN_*_PORT variables move them.
#
# The Makefile at the repository root wraps every command you need (`make help`). Everything
# runs in containers: the host needs Docker and make, not Python, not a GPU, not an API key.
# Later stages add profiles (lakehouse, stream, index, observe) to this file; `core` stays.

name: cairn

services:
  postgres:
    # Postgres 16 with pgvector. At Stage 0 it holds the seven contract tables, the index
    # tables and the request log (ADR-0003).
    image: pgvector/pgvector:pg16
    container_name: cairn-postgres
    profiles: [core]
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    ports:
      - "127.0.0.1:${CAIRN_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cairn -d cairn"]
      interval: 5s
      timeout: 3s
      retries: 24

  seaweedfs:
    # An S3-compatible object store for the raw bytes of every document version, under
    # raw/{source}/{sha[:2]}/{sha}. One process runs the master, a volume server, the filer and
    # the S3 gateway (:8333). Why not MinIO: its community images stopped in October 2025 and the
    # project was archived in 2026; SeaweedFS is Apache-2.0, maintained, and speaks S3 (and, for
    # later stages, the Iceberg REST catalog). The S3 API is the seam; the product behind it is not.
    image: chrislusf/seaweedfs:4.48
    container_name: cairn-seaweedfs
    profiles: [core]
    # The image's entrypoint adds -dir=/data; the rest is explicit.
    command: >-
      server -s3 -ip=seaweedfs -ip.bind=0.0.0.0 -volume.max=0
      -master.volumeSizeLimitMB=256 -s3.port=8333
    environment:
      # With no -s3.config, these two variables define the one (admin) identity.
      AWS_ACCESS_KEY_ID: cairn
      AWS_SECRET_ACCESS_KEY: cairn-local
    ports:
      - "127.0.0.1:${CAIRN_S3_PORT:-8333}:8333"
    volumes:
      - objects:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24

  api:
    # The code: `cairn serve` (FastAPI /ask, /feedback, /metrics, /healthz) and the `cairn`
    # command-line tool, which `make` runs with `docker compose exec`.
    build:
      context: .
      dockerfile: platform/Dockerfile
    image: cairn-api:stage-0
    container_name: cairn-api
    profiles: [core]
    environment:
      CAIRN_DATABASE_URL: postgresql://cairn:cairn@postgres:5432/cairn
      CAIRN_OBJECT_STORE: s3
      CAIRN_S3_ENDPOINT: http://seaweedfs:8333
      CAIRN_S3_BUCKET: cairn
      CAIRN_S3_ACCESS_KEY: cairn
      CAIRN_S3_SECRET_KEY: cairn-local
      CAIRN_TENANT_ID: local
      CAIRN_EMBEDDER: fastembed
      CAIRN_EMBEDDING_MODEL_ID: baai/bge-small-en@v1.5:384
      CAIRN_MODEL_CACHE: /models
      CAIRN_GOLDEN_DIR: /data/datasets/golden
      CAIRN_API_URL: http://localhost:8000
      # The optional generator. Unset means the extractive generator (no model call). Set these
      # here to change the api's default; `make ask` also passes the host's values per request.
      CAIRN_LLM_BASE_URL: ${CAIRN_LLM_BASE_URL:-}
      CAIRN_LLM_MODEL: ${CAIRN_LLM_MODEL:-}
      CAIRN_LLM_API_KEY: ${CAIRN_LLM_API_KEY:-}
      CAIRN_LLM_PROVIDER: ${CAIRN_LLM_PROVIDER:-openai-compatible}
      CAIRN_GIT_SHA: ${CAIRN_GIT_SHA:-}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    ports:
      - "127.0.0.1:${CAIRN_API_PORT:-8000}:8000"
    volumes:
      - ./platform:/app/platform            # source: edits need `make restart`, not a rebuild
      - ./packages:/app/packages            # the contracts, same reason
      - ./datasets:/data/datasets:ro        # the corpus and the golden sets
      - ./docs:/data/docs:ro                # the series' own docs, ingested as source docs-series
      - model-cache:/models                 # the embedding model, downloaded once
    extra_hosts:
      - "host.docker.internal:host-gateway" # so an LLM on the host (Ollama) is reachable on Linux too
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s                    # the first start downloads the embedding model

volumes:
  pgdata: {}
  objects: {}
  model-cache: {}
