[project]
name = "data-engineering-for-ai"
version = "0.0.0"
description = "Data Engineering for AI: the platform (Cairn), the flagship projects, and the shared packages behind the series."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.uv]
# The root is a workspace container, not an installable package.
package = false

[tool.uv.workspace]
members = ["packages/*", "platform"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/schemas/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cairn", "tests", "support"]
# The contracts package gets its own import block between third-party and the platform.
section-order = ["future", "standard-library", "third-party", "schemas", "first-party", "local-folder"]
sections = { schemas = ["cairn_schemas"] }

[tool.pytest.ini_options]
testpaths = ["packages/schemas/tests", "platform/tests"]
addopts = "-q"
filterwarnings = [
  # fastembed asks huggingface_hub for progress bars; the api container disables them by env var
  "ignore:Cannot enable progress bars:UserWarning",
]
